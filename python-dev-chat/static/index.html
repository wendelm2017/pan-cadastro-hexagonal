<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Dev Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f13;
            --bg-secondary: #1a1a24;
            --bg-tertiary: #242436;
            --bg-user-msg: #2d5a3d;
            --bg-bot-msg: #1e1e30;
            --text-primary: #e8e8f0;
            --text-secondary: #9494a8;
            --text-muted: #6b6b80;
            --accent: #4ade80;
            --accent-hover: #22c55e;
            --accent-subtle: rgba(74, 222, 128, 0.1);
            --border: #2a2a3d;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--accent), #059669);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .header-title h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .header-title span {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-color: var(--accent);
        }

        .btn-danger:hover {
            border-color: var(--danger);
            color: var(--danger);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        .welcome {
            text-align: center;
            padding: 60px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .welcome h2 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .welcome p {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .suggestion {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            cursor: pointer;
            text-align: left;
            color: var(--text-secondary);
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            line-height: 1.4;
        }

        .suggestion:hover {
            border-color: var(--accent);
            color: var(--text-primary);
            background: var(--accent-subtle);
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message-avatar.user {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        }

        .message-avatar.bot {
            background: linear-gradient(135deg, var(--accent), #059669);
        }

        .message-content {
            flex: 1;
            min-width: 0;
        }

        .message-sender {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }

        .message-body {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            line-height: 1.7;
            font-size: 14px;
            overflow-wrap: break-word;
        }

        .message.user .message-body {
            background: var(--bg-user-msg);
            border-color: rgba(74, 222, 128, 0.2);
        }

        .message-body p {
            margin-bottom: 10px;
        }

        .message-body p:last-child {
            margin-bottom: 0;
        }

        .message-body ul, .message-body ol {
            padding-left: 20px;
            margin-bottom: 10px;
        }

        .message-body li {
            margin-bottom: 4px;
        }

        .message-body code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .message-body pre {
            margin: 12px 0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .message-body pre code {
            display: block;
            padding: 16px;
            background: #0d1117;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }

        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'Inter', sans-serif;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message-body pre:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            color: var(--text-primary);
        }

        .message-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .message-body th, .message-body td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .message-body th {
            background: var(--bg-tertiary);
            font-weight: 600;
        }

        .message-body h1, .message-body h2, .message-body h3 {
            margin-top: 16px;
            margin-bottom: 8px;
        }

        .message-body h1 { font-size: 18px; }
        .message-body h2 { font-size: 16px; }
        .message-body h3 { font-size: 15px; }

        .message-body strong {
            color: var(--accent);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        .input-area {
            padding: 16px 24px 24px;
            background: var(--bg-primary);
            flex-shrink: 0;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 8px;
            transition: border-color 0.2s;
        }

        .input-box:focus-within {
            border-color: var(--accent);
        }

        #message-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 8px 12px;
            resize: none;
            max-height: 200px;
            line-height: 1.5;
        }

        #message-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            background: var(--accent);
            border: none;
            color: #0f0f13;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover {
            background: var(--accent-hover);
            transform: scale(1.05);
        }

        #send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
        }

        .input-footer {
            text-align: center;
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        @media (max-width: 640px) {
            header { padding: 12px 16px; }
            .chat-container { padding: 16px; }
            .input-area { padding: 12px 16px 16px; }
            .suggestions { grid-template-columns: 1fr; }
            .welcome { padding: 40px 16px; }
            .header-title span { display: none; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <div class="logo">&#128013;</div>
            <div class="header-title">
                <h1>Python Dev Chat</h1>
                <span>Desenvolvedor Python Senior</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-icon btn-danger" onclick="clearChat()" title="Limpar conversa">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
                Nova conversa
            </button>
        </div>
    </header>

    <div class="chat-container" id="chat">
        <div class="welcome" id="welcome">
            <div class="welcome-icon">&#128013;</div>
            <h2>Python Dev Chat</h2>
            <p>Seu assistente de desenvolvimento Python. Tire duvidas, peca codigo, analise de problemas, code review e muito mais.</p>
            <div class="suggestions">
                <button class="suggestion" onclick="sendSuggestion(this)">Cria uma API REST com FastAPI e arquitetura hexagonal</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Faz code review desse codigo Python que vou te mandar</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Como implementar testes unitarios com pytest e mock?</button>
                <button class="suggestion" onclick="sendSuggestion(this)">Cria um script de automacao para processar arquivos CSV</button>
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <div class="input-box">
                <textarea id="message-input" rows="1" placeholder="Digite sua mensagem..." onkeydown="handleKeyDown(event)"></textarea>
                <button id="send-btn" onclick="sendMessage()" disabled>
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div class="input-footer">Python Dev Chat &mdash; Powered by OpenAI</div>
        </div>
    </div>

    <script>
        const chatEl = document.getElementById('chat');
        const inputEl = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const welcomeEl = document.getElementById('welcome');
        const sessionId = crypto.randomUUID();
        let isStreaming = false;

        marked.setOptions({
            highlight: (code, lang) => {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true,
        });

        inputEl.addEventListener('input', () => {
            sendBtn.disabled = !inputEl.value.trim() || isStreaming;
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        });

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) sendMessage();
            }
        }

        function sendSuggestion(btn) {
            inputEl.value = btn.textContent;
            sendBtn.disabled = false;
            sendMessage();
        }

        function addMessage(role, content) {
            if (welcomeEl) welcomeEl.remove();

            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const isUser = role === 'user';
            const avatar = isUser ? '&#128100;' : '&#128013;';
            const sender = isUser ? 'Voce' : 'Python Dev';

            msgDiv.innerHTML = `
                <div class="message-avatar ${role}">${avatar}</div>
                <div class="message-content">
                    <div class="message-sender">${sender}</div>
                    <div class="message-body">${isUser ? escapeHtml(content) : content}</div>
                </div>
            `;

            chatEl.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv.querySelector('.message-body');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            let html = marked.parse(text);

            html = html.replace(/<pre><code(.*?)>([\s\S]*?)<\/code><\/pre>/g, (match, attrs, code) => {
                return `<pre><button class="copy-btn" onclick="copyCode(this)">Copiar</button><code${attrs}>${code}</code></pre>`;
            });

            return html;
        }

        function copyCode(btn) {
            const code = btn.nextElementSibling.textContent;
            navigator.clipboard.writeText(code);
            btn.textContent = 'Copiado!';
            setTimeout(() => btn.textContent = 'Copiar', 2000);
        }

        function scrollToBottom() {
            chatEl.scrollTop = chatEl.scrollHeight;
        }

        async function sendMessage() {
            const message = inputEl.value.trim();
            if (!message || isStreaming) return;

            isStreaming = true;
            sendBtn.disabled = true;
            inputEl.value = '';
            inputEl.style.height = 'auto';

            addMessage('user', message);

            const bodyEl = addMessage('bot', '');
            bodyEl.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message, session_id: sessionId }),
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullText = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    fullText += decoder.decode(value, { stream: true });
                    bodyEl.innerHTML = renderMarkdown(fullText);
                    scrollToBottom();
                }

                bodyEl.innerHTML = renderMarkdown(fullText);
                bodyEl.querySelectorAll('pre code').forEach(block => {
                    hljs.highlightElement(block);
                });
            } catch (error) {
                bodyEl.innerHTML = `<p style="color: var(--danger)">Erro ao conectar com o servidor. Verifique se a API esta rodando.</p>`;
            }

            isStreaming = false;
            sendBtn.disabled = !inputEl.value.trim();
            inputEl.focus();
            scrollToBottom();
        }

        async function clearChat() {
            try {
                await fetch('/api/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId }),
                });
            } catch (e) {}

            chatEl.innerHTML = `
                <div class="welcome" id="welcome">
                    <div class="welcome-icon">&#128013;</div>
                    <h2>Python Dev Chat</h2>
                    <p>Seu assistente de desenvolvimento Python. Tire duvidas, peca codigo, analise de problemas, code review e muito mais.</p>
                    <div class="suggestions">
                        <button class="suggestion" onclick="sendSuggestion(this)">Cria uma API REST com FastAPI e arquitetura hexagonal</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Faz code review desse codigo Python que vou te mandar</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Como implementar testes unitarios com pytest e mock?</button>
                        <button class="suggestion" onclick="sendSuggestion(this)">Cria um script de automacao para processar arquivos CSV</button>
                    </div>
                </div>
            `;
        }

        inputEl.focus();
    </script>
</body>
</html>
